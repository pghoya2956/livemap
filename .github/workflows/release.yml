name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: guard
        run: scripts/release-guard.sh
        env:
          TAG: ${{ github.ref_name }}
      - run: npm ci --no-audit --no-fund
      - name: 화면 번들 최신
        run: node scripts/build-ui.mjs && git diff --exit-code site/
      - run: npx --no playwright install --with-deps chromium
      - name: unit tests
        run: node --test test/*.test.mjs
      - name: tarball smoke
        run: scripts/smoke.sh
      - name: pack contents
        run: scripts/pack-contents.sh
      - name: leak scan
        run: scripts/leak-scan.sh
      - name: npm for trusted publishing
        run: |
          npm install -g npm@11.19.1
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - name: publish
        run: npm publish --access public
